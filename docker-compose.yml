# Lokaler Start: `docker compose up --build -d`
# Passwörter und Schlüssel kommen aus der Datei .env (Vorlage: .env.example), nie aus dieser Datei.
# Nur die Datenbank (für `npm run dev`): `docker compose up -d db`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: immo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: immo
    ports:
      - "5432:5432"
    volumes:
      - db-daten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immo -d immo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spielt ausstehende Datenbank-Migrationen ein und beendet sich dann.
  # Testdaten: `docker compose run --rm migrate npm run db:seed`. Läuft als Benutzer „app“ mit
  # demselben Volume „uploads“ wie die App, damit die Testdokumente dort ankommen.
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    user: app
    environment:
      DATABASE_URL: postgresql://immo:${POSTGRES_PASSWORD}@db:5432/immo?schema=public
      SEED_PASSWORT: ${SEED_PASSWORT:-}
      UPLOAD_DIR: /app/uploads
      # für „npm run mail:test“ (Testmails an den lokalen Test-Mailserver)
      MAIL_SMTP_HOST: mail-eingang
      EINGANG_MAIL_DOMAIN: ${EINGANG_MAIL_DOMAIN:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://immo:${POSTGRES_PASSWORD}@db:5432/immo?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET in .env setzen}
      AUTH_TRUST_HOST: "true"
      # KI (optional): ohne Schlüssel läuft die App normal, KI-Funktionen zeigen einen Hinweis
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KI_MODELL: ${KI_MODELL:-}
      # Öffentliche Adresse für Upload-Links (optional, lokal leer lassen)
      APP_URL: ${APP_URL:-}
      # E-Mail-Eingang: Domain der Import-Adressen; Webhook für einen echten Mail-Dienst nur mit Schlüssel
      EINGANG_MAIL_DOMAIN: ${EINGANG_MAIL_DOMAIN:-}
      EINGANG_MAIL_SCHLUESSEL: ${EINGANG_MAIL_SCHLUESSEL:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Lokaler Test-Mailserver für den E-Mail-Eingang (nur Testmails; echter Empfang: Produktionsreife)
  mail-eingang:
    build:
      context: .
      target: builder
    command: npm run mail:eingang
    user: app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://immo:${POSTGRES_PASSWORD}@db:5432/immo?schema=public
      UPLOAD_DIR: /app/uploads
      EINGANG_MAIL_DOMAIN: ${EINGANG_MAIL_DOMAIN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KI_MODELL: ${KI_MODELL:-}
    ports:
      - "127.0.0.1:2525:2525"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-daten:
  uploads:
